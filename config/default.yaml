# TIA Linter — Standard-Konfiguration
#
# Enthält alle 33 Prüfpunkte aus Pruefpunkte.md (einige Prüfpunkte sind hier
# als mehrere separat schaltbare Einträge abgebildet, z. B. Prüfpunkt 6 als
# plc_tag_eingaenge + plc_tag_ausgaenge).
#
# enabled   — Standardzustand der Checkbox in der GUI
# severity  — Standard-Schweregrad bei Verstoß: warning | error
# weitere Schlüssel je Prüfpunkt: Regex, Schwellenwerte, Listen, ...

report:
  pruefer: ""
  firma: ""
  logo_pfad: ""

logging:
  level: "INFO"
  file: null
  console: true

tia_versionen:
  verfuegbar:
    - name: "TIA Portal V21"
      version: 21
      dll_pfad: "C:\\Program Files\\Siemens\\Automation\\Portal V21\\PublicAPI\\V21\\net48\\Siemens.Engineering.Base.dll"
  standard: "TIA Portal V21"

# Maximale Anzahl automatischer Reconnect-Versuche, falls die TIA-Portal-
# Session während der Prüfung unerwartet stirbt (bekannt von TIA V19, siehe
# README). Bereits abgeschlossene Prüfpunkte werden bei einem Reconnect nicht
# wiederholt.
max_reconnect_attempts: 3

# Nach so vielen Prüfpunkten wird die TIA-Portal-Verbindung vorsorglich neu
# aufgebaut (unabhängig von echten Verbindungsabbrüchen). Grund: TIA Portal
# Openness zählt offene Objekt-Instanzen pro Session und wirft ab einem
# harten Limit (beobachtet: 500.000) eine EngineeringOutOfMemoryException,
# lange bevor ein größeres Projekt vollständig geprüft ist — siehe README.
reconnect_every_n_checks: 10

# Ordnernamen (Programmbausteine-, Datenbaustein- und Variablentabellen-
# Ordner), die komplett von der Prüfung ausgenommen werden sollen — z. B.
# bereits mehrfach geprüfte Bibliotheksordner. Ein ausgeschlossener Ordner
# nimmt automatisch auch alle seine Unterordner von der Prüfung aus.
# Vergleich ohne Berücksichtigung von Groß-/Kleinschreibung; es zählt
# ausschließlich der Ordnername selbst, nicht der vollständige Pfad — ein
# Ordner mit diesem Namen wird also unabhängig davon ausgeschlossen, wo im
# Projekt er liegt.
ausgeschlossene_ordner: []
#   - "Standardbibliothek"
#   - "Bereits geprüft"

# Bausteinnamen (FB/FC/OB/DB — Global-, Instanz- und Array-DBs), die komplett
# von der Prüfung ausgenommen werden sollen, unabhängig davon, in welchem
# Ordner sie liegen. Ein hier eingetragener Baustein taucht in keinem
# einzigen Prüfpunkt mehr auf — weder in der Namensprüfung noch in
# Inhaltsprüfungen (Kommentare, unbenutzte Variablen, Netzwerkkomplexität
# usw.), da alle Checks ausschließlich über dieselbe zentrale
# Traversierung an Bausteine gelangen. Vergleich ohne Berücksichtigung von
# Groß-/Kleinschreibung.
ausgeschlossene_bausteine: []
#   - "FB_Altsystem"
#   - "DB_Legacy_Rezepte"

checks:
  kommentare:
    # Prüfpunkt 1a — PLC-Tags und DB-Variablen ohne Kommentar.
    variablen_kommentar:
      enabled: true
      severity: warning
      ausnahme_prefixe: ["__"]
      # Einzelne Variablen, die unabhängig von ausnahme_prefixe von der
      # Prüfung ausgenommen werden sollen — vollständiger Name, exakte
      # Übereinstimmung (kein Präfix-/Teilstring-Abgleich). Gilt für
      # PLC-Tags und DB-Member gleichermaßen; bei DB-Membern inkl. eines
      # eventuellen Punktpfads, z. B. "Alm.Station_1".
      ausnahme_variables: ["System_Byte"]
      #   - "System_Byte"
      #   - "Alm.Station_1"

      # Datentypnamen (UDTs), deren Items von dieser Prüfung ausgenommen
      # werden sollen — wirkt wie ein manueller Zusatzeintrag zu den
      # automatisch erkannten UDTs (siehe Prüfpunkt 1b). Gedacht in erster
      # Linie für System-/Bibliotheksdatentypen, die in TIA Portal selbst
      # nirgends als PLC-Datentyp sichtbar definiert sind — für solche Typen
      # gibt es keine Möglichkeit, ihr Inneres zu prüfen (auch nicht über
      # Prüfpunkt 1b, das nur im Projekt sichtbare UDTs findet). Bewusst
      # nicht "ausnahme_system_udts" genannt: der Parameter eignet sich
      # ebenso, um eigene, sichtbare UDTs aus anderen Gründen auszunehmen.
      # Nur das UDT-typisierte Member selbst bleibt geprüft, seine Items
      # werden übersprungen.
      ausnahme_udts: ["DNN", "DTL", "CONN_OUC", "HW_ANY", "TCON", "TURCV", "TUSEND", "TDISCON", "TCON_IP_v4", "TADDR_Param", "LSNTP_typeTelegram", "HW_IOSYSTEM", "Date_And_Time", "TON_TIME"]
      #   - "TON"
      #   - "IEC_TIMER"

    # Prüfpunkt 1b — war in der ursprünglichen Liste kein eigener Punkt,
    # ergänzt Prüfpunkt 1a: Items innerhalb eines UDT-typisierten Members
    # werden dort bewusst nicht mehr einzeln geprüft (analog zu Array-
    # Elementen reicht ein Kommentar auf dem UDT-Member selbst) — stattdessen
    # prüft dieser Punkt den PLC-Datentyp (UDT) direkt: sowohl seinen eigenen
    # Kommentar als auch die Kommentare aller seiner Items.
    udt_kommentar:
      enabled: true
      severity: warning
      ausnahme_prefixe: ["__"]

    # Prüfpunkt 1c — war in der ursprünglichen Liste kein eigener Punkt,
    # ergänzt Prüfpunkt 1b: Multi-Instanz-FB-Aufrufe (Membertyp ist der Name
    # eines Funktionsbausteins, keines PLC-Datentyps) werden bei Prüfpunkt 1a
    # ebenfalls bewusst nicht mehr in die Tiefe geprüft — dieser Punkt prüft
    # stattdessen die Kommentare der FB-Interface-Member direkt an der
    # FB-Definition (nicht der FB-Kopfkommentar selbst, siehe baustein_beschreibung).
    fb_member_kommentar:
      enabled: true
      severity: warning
      ausnahme_prefixe: ["__"]

    # Prüfpunkt 2 — Bausteine (FB/FC/OB/DB) ohne (aussagekräftige)
    # Kopfbeschreibung.
    baustein_beschreibung:
      enabled: true
      severity: warning
      min_laenge: 20
      # Eine Kopfbeschreibung ist bei Datenbausteinen in der Praxis unüblich
      # (anders als bei FB/FC/OB, wo sie den Zweck des Codes beschreibt) —
      # daher standardmäßig false: DBs werden von dieser Prüfung
      # ausgenommen, FB/FC/OB werden unabhängig davon immer geprüft. Auf
      # true setzen, um auch DB-Kopfbeschreibungen zu prüfen.
      check_db: false

    # Prüfpunkt 3 — Netzwerke ohne Titel/Kurzbeschreibung oder mit zu langer
    # Beschreibung.
    netzwerk_beschreibung:
      enabled: true
      severity: warning
      max_zeichen: 80

    # Prüfpunkt 4 — Bausteinkopf ohne Versionsinfo/Änderungshistorie (Autor,
    # Version, Datum).
    aenderungshistorie:
      enabled: true
      severity: warning
      # Instanz-Datenbausteine pflegen keine eigene Änderungshistorie —
      # Autor/Version gehören zur FB-Definition, nicht zur einzelnen
      # Instanz. Daher standardmäßig false: Instanz-DBs werden von dieser
      # Prüfung ausgenommen, Global-/Array-DBs sowie FB/FC/OB werden
      # unabhängig davon immer geprüft. Auf true setzen, um auch
      # Instanz-DBs zu prüfen.
      check_idb: false

  namenskonventionen:
    # Prüfpunkt 5 ist in zwei unabhängig konfigurierbare Einträge aufgeteilt:
    # Instanz-DBs (Name meist automatisch aus dem FB-Aufruf abgeleitet)
    # folgen in der Praxis oft einer komplett anderen Namenskonvention als
    # frei benannte Global-/Array-Datenbausteine.
    db_format_global:
      enabled: true
      severity: error
      regex: '^DB_[A-Za-z]'

    db_format_instance:
      enabled: true
      severity: error
      regex: '^DB_[A-Za-z]'

    # Prüfpunkt 6 (Eingänge/Ausgänge) — PLC-Tag entspricht nicht dem
    # konfigurierten Namensmuster, getrennt konfigurierbar je Richtung.
    plc_tag_eingaenge:
      enabled: true
      severity: error
      regex: '^I_'

    plc_tag_ausgaenge:
      enabled: true
      severity: error
      regex: '^Q_'

    # Prüfpunkt 7 (FB/FC) — Bausteinname entspricht nicht dem konfigurierten
    # Regex, getrennt konfigurierbar je Bausteinart.
    fb_prefix:
      enabled: true
      severity: error
      regex: '^FB_\S*$'

    fc_prefix:
      enabled: true
      severity: error
      regex: '^FC_\S*$'

    # Prüfpunkt 8 — Konstante entspricht nicht dem konfigurierten Regex
    # (Standard: nur Großbuchstaben).
    konstanten_format:
      enabled: true
      severity: warning
      regex: '^[A-Z][A-Z0-9_]*$'

    # Prüfpunkt 9 — Variable mit Test-/Debug-Präfix (aus Liste) im Projekt
    # gefunden.
    testvariablen:
      enabled: true
      severity: warning
      prefixe: ["TEST_", "DEBUG_", "_TEMP"]

  programmstruktur:
    # Prüfpunkt 10 — Netzwerk ohne Inhalt (keine Kontakte, keine
    # Bausteinaufrufe).
    leere_netzwerke:
      enabled: true
      severity: warning
      # Ein leeres Netzwerk dient manchmal absichtlich als "Kapitelüberschrift"
      # innerhalb eines Bausteins (Netzwerktitel als Gliederungspunkt, kein
      # eigener Inhalt). Passt der Netzwerktitel auf dieses Muster, wird das
      # Netzwerk trotz fehlender Programmelemente nicht gemeldet. Leer ("") =
      # deaktiviert, jedes leere Netzwerk wird wie bisher gemeldet.
      ausnahme_titel_regex: '^#{5,}[^#]+#{5,}$'

    # Prüfpunkt 11a — PLC-Tag/DB-Variable wird im gesamten Programm nirgends
    # referenziert (Dead Code).
    unbenutzte_variablen:
      enabled: true
      severity: warning
      # UDT-/Struct-typisierte Member (in DBs wie in FB/FC/OB) werden bei
      # false (Standard) als Ganzes gewertet: Ist irgendein Unterfeld
      # referenziert (z. B. weil die Variable komplett an einen anderen
      # Baustein übergeben wird), gilt sie als verwendet und einzelne,
      # weiterhin ungenutzte Unterfelder werden nicht gemeldet. Ist die
      # Variable dagegen komplett unbenutzt, werden die Unterfelder trotzdem
      # einzeln gemeldet. Bei true werden immer alle Unterfelder einzeln
      # geprüft, ganz ohne diese Pauschal-Ausnahme (bisheriges Verhalten).
      unterelemente_pruefen: false

    # Prüfpunkt 11b — FB/FC/DB wird von keiner Stelle im Projekt
    # aufgerufen/referenziert.
    unbenutzte_bausteine:
      enabled: true
      severity: warning

    # Prüfpunkt 12a — Eingangs-Tag wird im Programm nie gelesen.
    eingaenge_gelesen:
      enabled: true
      severity: warning

    # Prüfpunkt 12b — Eingangs-Tag wird im Programm beschrieben (statt nur
    # gelesen). Eingänge werden jeden Zyklus vom Prozessabbild aus der
    # Hardware überschrieben — ein Schreibzugriff aus dem Anwenderprogramm
    # wird beim nächsten Zyklus ohnehin verworfen und deutet meist auf eine
    # Verwechslung mit einem Merker hin. Deshalb Standard-Schweregrad
    # Fehler, nicht nur Warnung.
    eingaenge_nicht_beschrieben:
      enabled: true
      severity: error

    # Prüfpunkt 13 — Ausgangs-Tag wird an mehreren Stellen im Programm
    # beschrieben.
    ausgaenge_mehrfach_schreiben:
      enabled: true
      severity: error

    # Prüfpunkt 14 — Baustein bzw. Netzwerk ist in AWL/STL programmiert
    # (gilt als veraltet).
    awl_code:
      enabled: true
      severity: warning

    # Prüfpunkt 15 — Innerhalb eines Bausteins werden mehrere
    # Programmiersprachen gemischt (z. B. KOP und SCL).
    gemischte_sprachen:
      enabled: true
      severity: warning
      # SCL-Netzwerke in einem sonst in FUP programmierten Baustein sind
      # betrieblich weit verbreitet und gelten nicht als Problem — bei
      # true (Standard) wird genau diese Kombination (FUP+SCL) nicht
      # gemeldet, jede andere Sprachmischung weiterhin schon. Bei false
      # gilt wieder das bisherige Verhalten (jede Mischung wird gemeldet).
      scl_in_fup_ignorieren: true

    # Prüfpunkt 16 — Netzwerk mit mehr Elementen als der konfigurierte
    # Schwellenwert.
    max_netzwerk_elemente:
      enabled: true
      severity: warning
      max_elemente: 50
      # Gilt nur für grafische Netzwerke (KOP/FUP/GRAPH), gezählt anhand
      # der Programmelemente (Kontakte, Spulen, Bausteinaufrufe, ...).
      max_zeilen_scl: 50
      # Gilt für SCL-Netzwerke (eigenständige SCL-Bausteine sowie einzelne
      # SCL-Netzwerke innerhalb eines sonst grafischen Bausteins), gezählt
      # anhand der Code-Zeilen.

  hardware:
    # Prüfpunkt 17 — Für einen I/O-Tag ist kein passendes, aktives
    # Hardware-Modul vorhanden.
    hardware_vorhanden:
      enabled: true
      severity: error

    # Prüfpunkt 18a — CPU-Typ oder Firmware-Version sind in den
    # Projekteigenschaften nicht vermerkt.
    cpu_firmware_dokumentiert:
      enabled: true
      severity: warning

    # Prüfpunkt 18b — F-CPU ohne gesetztes Safety-Offline-Passwort.
    safety_passwort:
      enabled: true
      severity: error

    # Prüfpunkt 18c — Kein Kommunikationszertifikat vorhanden oder
    # Restlaufzeit unter Schwellenwert.
    zertifikat:
      enabled: true
      severity: warning
      min_restlaufzeit_monate: 6

  projektmetadaten:
    # Prüfpunkt 19 — Konfiguriertes Pflichtfeld in den Top-Level-
    # Projekteigenschaften ist leer. Wichtig: 'felder' muss die echten
    # (englischen) Openness-Attributnamen enthalten, nicht die deutsche
    # GUI-Bezeichnung, wie sie im TIA-Portal-Dialog "Projekteigenschaften"
    # angezeigt wird (z. B. 'Author', nicht 'Autor').
    #
    # Vollständige Liste aller von der Openness-API als Projekt-Attribute
    # gelieferten Felder (live per project.GetAttributeInfos() geprüft,
    # V21-Referenz Manual 03/2026, Abschnitt "Projektbezogene Attribute
    # lesen"). Als Text-Pflichtfeld sinnvoll nutzbar:
    #   - "Author"    -> Autor des Projekts
    #   - "Comment"   -> Kommentar des Projekts (mehrsprachig — wird intern
    #                    automatisch über die Referenzsprache aufgelöst,
    #                    keine Besonderheit bei der Config nötig)
    #   - "Copyright" -> Copyright-Hinweis des Projekts
    #   - "Family"    -> Familie des Projekts
    #   - "Version"   -> Version des Projekts
    # Weitere von der API gelieferte Attribute (CreationTime, IsModified,
    # LanguageSettings, LastModified, LastModifiedBy, Name, Path, Size)
    # sind entweder automatisch gesetzte/technische Werte (nie leer, daher
    # als Pflichtfeld wirkungslos) oder keine Textfelder — hier nicht
    # verwenden. Hinweis: "Copyright" und "Family" tauchen im TIA-Portal-
    # Standarddialog "Projekteigenschaften" u. U. gar nicht als editierbares
    # Feld auf — vorher in TIA prüfen, ob sich das Feld überhaupt befüllen
    # lässt, bevor es hier als Pflichtfeld eingetragen wird.
    pflichtfelder:
      enabled: true
      severity: warning
      felder: ["Author", "Version"]

    # Prüfpunkt 20 — Mehr aktive Sprachen im Projekt als konfiguriertes
    # Maximum (oft vergessene Testsprachen).
    max_sprachen:
      enabled: true
      severity: warning
      max: 2

    # Prüfpunkt 21 — Beim Übersetzen der PLC-Software sind Fehler oder
    # Warnungen aufgetreten.
    kompilierfehler:
      enabled: true
      severity: error
      # Liste literaler Teiltexte (KEIN Regex! — reale Compiler-Meldungen
      # enthalten oft Klammern/Anführungszeichen, die als Regex-Metazeichen
      # den Abgleich stillschweigend zum Scheitern bringen würden), auf die
      # der Meldungstext case-insensitiv geprüft wird. Ein Treffer
      # unterdrückt die Meldung vollständig, dauerhaft, unabhängig von
      # Baustein oder Fehler-/Warnungsstatus. Nur für Meldungen eintragen,
      # die bewusst und dauerhaft als irrelevant eingestuft werden — im
      # Zweifel lieber den Entwickler kontaktieren, statt eine unbekannte
      # Meldung hier zu unterdrücken.
      ignorierte_meldungen: []
      #   - "since it is write-protected"
      #   - "because it is not editable"

  bibliotheken:
    # Prüfpunkt 22 — Verwendeter Bibliothekstyp entspricht nicht der
    # aktuellen Bibliotheksversion.
    veraltete_bibliotheken:
      enabled: true
      severity: warning

    # Prüfpunkt 23 — Instanz-Datenbaustein, dessen Quell-FB nicht mehr im
    # Projekt existiert.
    verwaiste_instanz_dbs:
      enabled: true
      severity: error

  styleguide:
    # Prüfpunkt 24 — Kommentare/Netzwerktitel weichen von der in Config
    # erwarteten Sprache ab.
    sprachen_konsistent:
      enabled: true
      severity: warning
      erwartete_sprache: "de"

    # Prüfpunkt 25 — Static-Tag eines FB wird von außerhalb des FB direkt
    # gelesen/beschrieben (statt über Ein-/Ausgangsparameter gekapselt).
    static_zugriff_extern:
      enabled: true
      severity: warning

    # Prüfpunkt 26 — VAR_OUTPUT-Parameter wird innerhalb eines Bausteins an
    # mehreren Stellen beschrieben.
    output_mehrfach_beschrieben:
      enabled: true
      severity: error

    # Prüfpunkt 27 — Identische STRUCT-Definition kommt in mehreren DBs vor,
    # ohne als UDT ausgelagert zu sein.
    udt_wiederkehrende_strukturen:
      enabled: true
      severity: warning

    # Prüfpunkt 28 — OB1 (Main) enthält mehr Netzwerke mit eigener Logik als
    # der konfigurierte Schwellenwert.
    ob1_komplexitaet:
      enabled: true
      severity: warning
      max_netzwerke_mit_logik: 5

    # Prüfpunkt 29 — Know-how-geschützter Baustein ist nicht als solcher
    # dokumentiert.
    know_how_schutz:
      enabled: true
      severity: warning
      # Liste literaler Teiltexte (kein Regex, siehe Prüfpunkt 21), von denen
      # mindestens einer case-insensitiv in der Kopfbeschreibung vorkommen
      # muss, damit der Know-how-Schutz als dokumentiert gilt.
      dokumentations_hinweise: ["know-how", "knowhow"]

    # Prüfpunkt 30 — Tag-Tabelle enthält Tags außerhalb des I-/
    # Q-Adressbereichs.
    tag_tabellen_nur_io:
      enabled: true
      severity: warning

    # Prüfpunkt 31 — Baustein ist mit Standard- statt optimiertem
    # Bausteinzugriff projektiert.
    nicht_optimierte_bausteine:
      enabled: true
      severity: warning

    # Prüfpunkt 32 — Mehr Bausteine im Wurzelordner als der konfigurierte
    # Schwellenwert.
    bausteine_im_root:
      enabled: true
      severity: warning
      max_bausteine_root: 20

    # Prüfpunkt 33 (neu in V21) — Baustein hat Schreibschutz, der nicht
    # dokumentiert ist.
    schreibschutz:
      enabled: true
      severity: warning
      # Liste literaler Teiltexte (kein Regex, siehe Prüfpunkt 21), von denen
      # mindestens einer case-insensitiv in der Kopfbeschreibung vorkommen
      # muss, damit der Schreibschutz als dokumentiert gilt.
      dokumentations_hinweise: ["schreibschutz", "write-protect"]
